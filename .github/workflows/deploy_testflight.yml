name: Deploy to TestFlight

# Trigger: Executa automaticamente quando há push na branch main
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy to TestFlight
    runs-on: macos-latest
    
    steps:
      # Step 1: Checkout do código do repositório
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # Step 2: Configurar Ruby e instalar dependências do Bundler
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true # Cache automático do Gemfile.lock
      
      # Step 3: Instalar dependências do projeto (Gems do Fastlane)
      - name: Install dependencies
        run: |
          if [ -f "Gemfile" ]; then
            bundle install
          else
            echo "⚠️ Gemfile não encontrado. Criando Gemfile básico..."
            cat > Gemfile << EOF
          source "https://rubygems.org"
          gem "fastlane"
          EOF
            bundle install
          fi
      
      # Step 4: Verificar e criar estrutura do Fastlane se necessário
      - name: Setup Fastlane
        run: |
          if [ ! -d "fastlane" ]; then
            echo "⚠️ Pasta fastlane não encontrada. Criando estrutura básica..."
            mkdir -p fastlane
          fi
          
          if [ ! -f "fastlane/Fastfile" ]; then
            echo "⚠️ Fastfile não encontrado. Criando Fastfile básico..."
            cat > fastlane/Fastfile << 'FASTFILE_EOF'
          opt_out_usage
          
          default_platform(:ios)
          
          platform :ios do
            desc "Build e upload para TestFlight"
            lane :beta do
              increment_build_number(xcodeproj: "Focca.xcodeproj")
              build_app(
                scheme: "Focca",
                export_method: "app-store"
              )
              upload_to_testflight(
                skip_waiting_for_build_processing: true,
                skip_submission: true
              )
              UI.success("✅ Build enviado com sucesso para o TestFlight!")
            end
          end
          FASTFILE_EOF
          fi
      
      # Step 5: Executar o Fastlane para buildar e enviar ao TestFlight
      # O comando 'fastlane beta' deve estar configurado no Fastfile do projeto
      # As variáveis de ambiente são passadas diretamente para o Fastlane
      # O Fastlane detecta automaticamente essas variáveis para autenticação com App Store Connect
      - name: Build and Upload to TestFlight
        env:
          # Variáveis de ambiente para autenticação com App Store Connect API
          # Essas variáveis são configuradas como GitHub Secrets
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          # Alternativamente, você pode usar o caminho do arquivo se preferir:
          # APP_STORE_CONNECT_API_KEY_PATH: ${{ secrets.APP_STORE_CONNECT_API_KEY_PATH }}
        run: |
          bundle exec fastlane beta

